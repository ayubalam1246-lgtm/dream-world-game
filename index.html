<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>DON'T TAP RED — V-2</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    touch-action: manipulation;
}

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle at center, #252525, #080808);
}

#top {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
    font-weight: bold;
}

.stat {
    background: rgba(0,0,0,.55);
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 16px;
}

#message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    text-align: center;
    z-index: 20;
}

#message h1 {
    margin: 0 0 10px;
    font-size: clamp(34px, 10vw, 64px);
    letter-spacing: 2px;
}

#message p {
    font-size: 18px;
    opacity: .8;
}

button {
    border: 0;
    padding: 15px 30px;
    border-radius: 15px;
    background: white;
    color: #111;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

#playArea {
    position: absolute;
    inset: 75px 0 0 0;
}

.tile {
    position: absolute;
    width: 74px;
    height: 74px;
    border-radius: 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    font-size: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,.35);
    user-select: none;
}

.safe {
    background: #eeeeee;
    color: #111;
}

.red {
    background: #e21b23;
    color: white;
    box-shadow: 0 0 22px rgba(255,0,0,.65);
}

.pop {
    animation: pop .18s ease-out;
}

@keyframes pop {
    0% { transform: scale(.7); opacity: .3; }
    100% { transform: scale(1); opacity: 1; }
}

.shake {
    animation: shake .3s;
}

@keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-12px); }
    75% { transform: translateX(12px); }
}

#gameOver {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 50;
    background: rgba(0,0,0,.86);
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;
}

#gameOver h2 {
    font-size: 42px;
    margin: 0 0 10px;
}

#finalScore {
    font-size: 28px;
    margin: 10px 0 22px;
}

.small {
    font-size: 13px;
    opacity: .6;
    margin-top: 18px;
}
</style>
</head>

<body>

<div id="game">

    <div id="top">
        <div class="stat">SCORE: <span id="score">0</span></div>
        <div class="stat">BEST: <span id="best">0</span></div>
        <div class="stat">TIME: <span id="time">30</span></div>
    </div>

    <div id="message">
        <h1>DON'T TAP RED</h1>
        <p>Tap the safe tiles. Avoid RED.</p>
        <button id="startBtn">PLAY V-2</button>
        <div class="small">Android Touch Edition</div>
    </div>

    <div id="playArea"></div>

    <div id="gameOver">
        <div>
            <h2>GAME OVER</h2>
            <div id="finalScore">Score: 0</div>
            <button id="restartBtn">PLAY AGAIN</button>
        </div>
    </div>

</div>

<script>
const playArea = document.getElementById("playArea");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const timeEl = document.getElementById("time");
const message = document.getElementById("message");
const gameOver = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");
const game = document.getElementById("game");

let score = 0;
let best = Number(localStorage.getItem("dontTapRedBest") || 0);
let time = 30;
let running = false;
let timer = null;
let spawnTimer = null;

bestEl.textContent = best;

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function createTile() {
    if (!running) return;

    const tile = document.createElement("div");
    tile.className = "tile pop";

    const isRed = Math.random() < Math.min(.18 + score / 250, .42);

    if (isRed) {
        tile.classList.add("red");
        tile.textContent = "RED";
    } else {
        tile.classList.add("safe");
        tile.textContent = "TAP";
    }

    const maxX = Math.max(5, playArea.clientWidth - 79);
    const maxY = Math.max(5, playArea.clientHeight - 79);

    tile.style.left = random(5, maxX) + "px";
    tile.style.top = random(5, maxY) + "px";

    tile.addEventListener("pointerdown", function(e) {
        e.preventDefault();

        if (!running) return;

        if (tile.classList.contains("red")) {
            endGame();
        } else {
            score++;
            scoreEl.textContent = score;

            if (score > best) {
                best = score;
                bestEl.textContent = best;
                localStorage.setItem("dontTapRedBest", best);
            }

            tile.remove();

            if (score % 5 === 0) {
                navigator.vibrate?.(25);
            }

            createTile();
        }
    });

    playArea.appendChild(tile);

    setTimeout(() => {
        if (tile.parentNode) tile.remove();
    }, Math.max(700, 1500 - score * 12));
}

function startGame() {
    score = 0;
    time = 30;
    running = true;

    scoreEl.textContent = "0";
    timeEl.textContent = time;

    message.style.display = "none";
    gameOver.style.display = "none";

    playArea.innerHTML = "";

    for (let i = 0; i < 4; i++) {
        createTile();
    }

    clearInterval(timer);
    clearInterval(spawnTimer);

    timer = setInterval(() => {
        time--;
        timeEl.textContent = time;

        if (time <= 0) {
            endGame();
        }
    }, 1000);

    spawnTimer = setInterval(() => {
        createTile();

        if (score > 15) {
            createTile();
        }
    }, 850);
}

function endGame() {
    if (!running) return;

    running = false;

    clearInterval(timer);
    clearInterval(spawnTimer);

    playArea.innerHTML = "";

    finalScore.textContent = "Score: " + score;
    gameOver.style.display = "flex";

    game.classList.add("shake");

    navigator.vibrate?.([100, 60, 100]);

    setTimeout(() => {
        game.classList.remove("shake");
    }, 350);
}

document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("restartBtn").addEventListener("click", startGame);
</script>

</body>
  </html>
